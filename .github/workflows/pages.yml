name: Deploy Gloamgear Dominion to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Dominion build
        run: |
          test -s index.html
          test -s travian.css
          test -s travian.js
          grep -q 'travian.css' index.html
          grep -q 'travian.js' index.html
          grep -q 'village-scene' travian.css
          grep -q 'function village' travian.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
