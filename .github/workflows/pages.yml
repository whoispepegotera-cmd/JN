name: Deploy Gloamgear to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble final Gloamgear page
        run: |
          cat build/final_part1.html build/final_part2.html build/final_part3.html build/final_part4.html > index.html
          mkdir -p assets/runtime
          base64 --decode assets/runtime/mara_combat.b64 > assets/runtime/mara_combat.webp
          base64 --decode assets/runtime/hound.b64 > assets/runtime/hound.webp
          base64 --decode assets/runtime/boss.b64 > assets/runtime/boss.webp
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('</body>', '<script src="./combat-fix.js?v=${{ github.sha }}"></script><script src="./combat_atlas_fix.js?v=${{ github.sha }}"></script></body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
