name: Deploy Gloamgear and Dominion to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    paths:
      - 'gloamgear/**'
      - 'scripts/*gloamgear*'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify existing Dominion build
        run: |
          test -s index.html
          test -s travian.css
          test -s travian.js
          grep -q 'travian.css' index.html
          grep -q 'travian.js' index.html
          grep -q 'village-scene' travian.css
          grep -q 'function village' travian.js
      - name: Build the independent Gloamgear browser route
        run: node scripts/build-gloamgear-browser.mjs
      - name: Verify combat and save regressions before publishing
        run: node scripts/test-gloamgear-core.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Published browser game URL
        run: echo 'PUBLISHED_GAME_URL=${{ steps.deployment.outputs.page_url }}gloamgear/'
