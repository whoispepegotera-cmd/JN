eElement('div');d.style.cssText='position:fixed;right:14px;top:78px;z-index:200;background:#171219ee;border:1px solid #c58e45;padding:9px 12px;border-radius:5px';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2300)}function render(){let w=wi(),st=stats();app.innerHTML=`<div class="app"><header><div class="profile"><div class="portrait">${sh(0)}</div><div><b>MARA VELL</b><small>Nv. ${s.level} · Stage ${s.stage}</small></div></div><button class="top" data-m="Personaje"><i>♟</i>Personaje</button><button class="top" data-m="Inventario"><i>▣</i>Inventario</button><div class="logo">GLOAMGEAR<small>THE UNENDING REEL</small></div><button class="top" data-m="Misiones"><i>✦</i>Misiones</button><button class="top" data-m="Mundos"><i>⌘</i>Mundos</button><button class="top" data-m="Prestigio"><i>✧</i>Prestigio</button><div class="money"><div class="pill"><b>◉ ${fmt(s.gold)}</b></div><div class="pill"><b style="color:#77c8ff">◆ ${fmt(s.gleam)}</b></div></div></header><main><section class="panel"><div class="pt">Los 15 mundos</div><div class="pb">${W.map((x,i)=>`<div class="world ${i===w?'on':''} ${i*50+1>s.high?'lock':''}" data-world="${i}"><div class="wi" style="background-position:${bg(i)}"></div><span>${String(i+1).padStart(2,'0')} · <b>${x[0]}</b>Stages ${i*50+1}-${i*50+50}</span></div>`).join('')}</div></section><section class="center"><div class="stagehead"><strong>${W[w][0]}</strong><span>Stage ${s.stage}/750</span><div class="prog"><i style="width:${ls()*2}%"></i></div><span>☠</span></div><div class="view"><div class="stagebg" style="background-position:${bg(w)}"></div><div class="ground"></div><canvas id="fx"></canvas><div class="actor mara">${sh(0,'body')}${sh(1,'weapon')}</div><div class="actor foe ${e.k==='boss'?'boss':e.k!=='normal'?'elite':''}">${sh(e.idx,'body')}</div><div class="tele"></div><div class="flash"></div><div class="ehud"><div class="name">${e.name}</div><small>${e.k.toUpperCase()}</small><div class="hp"><i id="ehp" style="width:${100*e.hp/e.max}%"></i></div></div><div class="phud"><div class="face">${sh(0)}</div><div><small>MARA VELL · NV. ${s.level}</small><div class="hp"><i id="php" style="width:${100*s.hp/st.hp}%"></i></div><div class="mana"><i id="energy" style="width:${s.en}%"></i></div></div></div></div><div class="combatbar"><div id="log" class="log">${logs.map(x=>`<span class="${x.c}">${x.t}</span>`).join('')}</div><div class="skills">${['✦','🔥','⚡','◉'].map((z,i)=>`<button class="orb" data-skill="${i}">${z}<div id="cd${i}" class="cd"></div><b>${'QWER'[i]}</b></button>`).join('')}</div></div></section><section class="right"><div class="panel"><div class="pt">Mapa del mundo</div><div class="pb"><div class="map"><div class="mnodes">${[10,20,30,40,50].map(n=>`<i class="mn ${ls()>=n?'on':''}"></i>`).join('')}</div></div></div></div><div class="panel"><div class="pt">Botín de etapa</div><div class="pb"><div class="grid4">${[14,15,16,17,18,19,20,21].map(i=>`<div class="icon">${sh(i)}</div>`).join('')}</div></div></div><div class="panel"><div class="pt">Enemigos</div><div class="pb"><div class="grid4">${[2,3,4,e.idx].map(i=>`<div class="icon">${sh(i)}</div>`).join('')}</div><p style="font-size:10px">Jefe: ${W[w][1]}</p></div></div></section></main><footer>${[['Combate','⚔'],['Inventario','▣'],['Personaje','♟'],['Árbol','✺'],['Maestrías','◎'],['Misiones','✦'],['Mundos','⌘'],['Prestigio','✧']].map(x=>`<button class="nav ${x[0]==='Combate'&&!modal?'on':''}" data-m="${x[0]}">${x[1]} ${x[0]}</button>`).join('')}<div class="sp"></div><button class="nav" id="auto">AUTO ${auto?'ON':'OFF'}</button><button class="nav" id="spd">x${speed}</button><button class="nav" id="snd">♫ ${audio?'ON':'OFF'}</button></footer></div>${modal?modalHTML():''}`;bind()}function modalHTML(){return`<div class="modal"><div class="win"><div class="wh"><h2>${modal}</h2><button class="close">Cerrar ✕</button></div><div class="wb">${body(modal)}</div></div></div>`}function body(m){if(m==='Inventario')return`<div class="equip">${SLOTS.map(z=>{let q=s.eq[z];return`<div class="slot"><b>${z}</b>${q?`${q.name}<br><span style="color:${RC[q.rar]}">${RAR[q.rar]} +${q.pow}</span>`:'Vacío'}</div>`}).join('')}</div><div class="cards">${s.inv.length?s.inv.map((q,i)=>`<div class="card"><h3>${q.name}</h3><b style="color:${RC[q.rar]}">${RAR[q.rar]}</b><p>${q.slot} · Poder ${q.pow}</p><button class="btn pri" data-equip="${i}">Equipar</button> <button class="btn" data-sell="${i}">Vender</button></div>`).join(''):'<div class="card">Sin objetos todavía.</div>'}</div>`;if(m==='Personaje'){let t=stats();return`<div style="display:grid;grid-template-columns:260px 1fr;gap:12px"><div class="card"><div style="height:340px">${sh(0)}</div><h3>Mara Vell</h3><p>Portadora del Framecutter.</p></div><div><div class="stats">${[['Nivel',s.level],['Ataque',fmt(t.atk)],['Vida',fmt(t.hp)],['Crítico',Math.round(t.crit*100)+'%'],['Stage',s.stage],['Prestigio',s.prestige],['Fragmentos',s.frag],['Kills',s.stats.kills]].map(q=>`<div class="stat"><small>${q[0]}</small><b>${q[1]}</b></div>`).join('')}</div><div class="card" style="margin-top:8px"><h3>Framecutter</h3><div style="height:220px">${sh(1)}</div></div></div></div>`}if(m==='Árbol')return`<div class="branches">${BR.map((b,bi)=>`<div class="branch"><h3>${b}</h3><div class="nodes">${Array.from({length:20},(_,j)=>{let i=bi*20+j;return`<button class="node ${s.nodes[i]?'on':''}" data-node="${i}">${j+1}</button>`}).join('')}</div></div>`).join('')}</div>`;if(m==='Maestrías')return`<div class="cards">${MAST.map((x,i)=>{let l=Math.floor(s.mastery[i]/100);return`<div class="card"><h3>${x} Mastery</h3><p>Nivel ${l}/20${l>=20?' + Paragon':''}</p><div class="mbar"><i style="width:${s.mastery[i]%100}%"></i></div><p>+${(l*1.5).toFixed(1)}% efecto.</p></div>`}).join('')}</div>`;if(m==='Misiones')return`<div class="cards">${Array.from({length:30},(_,i)=>{let g=(i+1)*10,d=Math.min(g,s.stats.kills);return`<div class="card"><h3>${['Story','Daily','Weekly','Boss','Event','Mastery'][i%6]} · Cue ${i+1}</h3><p>Derrota ${g} enemigos · ${d}/${g}</p><div class="mbar"><i style="width:${d/g*100}%"></i></div></div>`}).join('')}</div>`;if(m==='Mundos')return`<div class="cards">${W.map((x,i)=>`<div class="card"><div style="height:110px;background:url('assets/worlds.webp');background-size:500% 300%;background-position:${bg(i)}"></div><h3>${i+1}. ${x[0]}</h3><p>Stages ${i*50+1}-${i*50+50}<br>Boss: ${x[1]}</p><button class="btn ${i*50+1<=s.high?'pri':''}" data-jump="${i}">${i*50+1<=s.high?'Viajar':'Bloqueado'}</button></div>`).join('')}</div>`;if(m==='Prestigio'){let g=Math.floor(Math.pow(Math.max(0,s.high-120)/25,1.45)*(1+s.stats.bosses*.08));return`<div class="card" style="max-width:650px;margin:auto;text-align:center"><div style="font-size:70px;color:#e1a146">✧</div><h3>Prestigio / Rebobinado</h3><p>Reinicia nivel, stage y equipo. Conservas maestrías, progreso de cuenta y Fragmentos de Continuidad.</p><p style="font-size:27px;color:#f0c36e">+${g} Fragmentos</p><button class="btn pri" id="prestige" ${s.high<150?'disabled':''}>REBOBINAR</button></div>`}return''}function bind(){document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{modal=b.dataset.m==='Combate'?'':b.dataset.m;render()});document.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>{let i=+b.dataset.world;if(i*50+1<=s.high){s.stage=i*50+1;spawn();render()}else toast('Mundo bloqueado')});document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>skill(+b.dataset.skill));$('#auto').onclick=()=>{auto=!auto;render()};$('#spd').onclick=()=>{speed=speed===1?2:speed===2?4:1;render()};$('#snd').onclick=()=>{audio=!audio;render()};let c=$('.close');if(c)c.onclick=()=>{modal='';render()};document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{let i=+b.dataset.equip,q=s.inv[i];s.eq[q.slot]=q;s.inv.splice(i,1);s.hp=stats().hp;save();render()});document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{let i=+b.dataset.sell,q=s.inv[i];s.gold+=q.pow*4;s.inv.splice(i,1);save();render()});document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{let i=+b.dataset.node,cost=100+s.nodes.filter(Boolean).length*45;if(s.nodes[i]){s.nodes[i]=false;s.gold+=Math.floor(cost*.5)}else if(s.gold>=cost){s.gold-=cost;s.nodes[i]=true}else return toast('Oro insuficiente');save();render()});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{let i=+b.dataset.jump;if(i*50+1<=s.high){s.stage=i*50+1;modal='';spawn();render()}});let p=$('#prestige');if(p)p.onclick=()=>{if(s.high<150)return;let g=Math.floor(Math.pow(Math.max(0,s.high-120)/25,1.45)*(1+s.stats.bosses*.08));s.frag+=g;s.prestige++;s.level=1;s.xp=s.gold=0;s.stage=1;s.inv=[];s.eq={};s.hp=stats().hp;modal='';spawn();save();render();toast(`Prestigio ${s.prestige} · +${g} Fragmentos`)}}window.addEventListener('keydown',x=>{let i='qwer'.indexOf(x.key.toLowerCase());if(i>=0)skill(i)});window.addEventListener('beforeunload',save);load();requestAnimationFrame(loop)})();
</script></body></html>
