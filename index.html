function drop(){let roll=Math.random(),ri=roll>.997?7:roll>.99?6:roll>.965?5:roll>.91?4:roll>.78?3:roll>.58?2:roll>.3?1:0;let it={id:crypto.randomUUID?.()||Date.now()+Math.random(),name:ITEMS[Math.floor(Math.random()*ITEMS.length)],rarity:ri,power:Math.round((state.level*3+8)*(1+ri*.5)*(0.85+Math.random()*.4)),slot:SLOTS[Math.floor(Math.random()*SLOTS.length)]};state.inventory.unshift(it);state.inventory=state.inventory.slice(0,160);state.stats.loot++;addLog('✦ '+it.name+' · '+RAR[ri],'loot');toast(RAR[ri]+' encontrado: '+it.name)}
function kill(){state.stats.kills++;if(enemy.kind==='boss')state.stats.boss++;let gold=Math.round((12+state.stage*3.1)*(1+state.prestige*.12)),xp=Math.round((32+state.stage*4.2)*(enemy.kind==='boss'?4:enemy.kind==='miniboss'?2.2:enemy.kind==='elite'?1.5:1));state.gold+=gold;state.xp+=xp;if(Math.random()<.28+(enemy.kind==='boss'?.7:0))drop();while(state.xp>=xpNeed(state.level)){state.xp-=xpNeed(state.level);state.level++;state.gleam+=state.level%10===0?2:0;addLog('LEVEL UP → '+state.level,'crit');toast('Mara alcanza nivel '+state.level)}const old=state.stage;if(state.stage<750){state.stage++;state.highest=Math.max(state.highest,state.stage);state.stats.stages++}if(Math.floor((old-1)/50)!==worldIndex()){worldBuilt=-1;toast('Nuevo mundo: '+WORLDS[worldIndex()][0])}spawn();save();renderHud(true)}
function hurt(amount){let st=calcStats(),red=st.armor/(st.armor+100+12*enemy.level),d=amount*(1-Math.min(.75,red));state.hp-=d;state.hp=Math.max(0,state.hp);animEnemy=.34;shake=Math.min(1,shake+.45);addLog('Mara recibe '+fmt(d),'hurt');if(state.hp<=0){state.stats.deaths++;state.hp=st.maxHp;enemy.hp=enemy.maxHp;addLog('Reel roto. Mara vuelve a la escena.','hurt');toast('Rebobinado de combate');spawn()}}
function hit(mult=1,skill=false){let st=calcStats(),crit=Math.random()<st.crit,dmg=st.atk*mult*(crit?1.65:1)*(0.88+Math.random()*.24);enemy.hp-=dmg;enemy.hp=Math.max(0,enemy.hp);state.stats.damage+=dmg;if(crit)state.stats.crit=Math.max(state.stats.crit,dmg);animAttack=.42;shake=Math.min(1,shake+(crit?.6:.25));burstParticles(crit?0xffd35a:skill?0x67bfff:0xff783d,crit?24:14);damagePop(dmg,crit);addLog((crit?'CRIT ':'')+fmt(dmg)+' → '+enemy.name,crit?'crit':'');state.tempo=clamp(state.tempo+9,0,100);if(enemy.hp<=0)kill()}
function useSkill(i){if(skillCd[i]>0)return;const costs=[0,18,22,45],cd=[2.8,5.2,7.5,12];if(state.tempo<costs[i])return;state.tempo-=costs[i];skillCd[i]=cd[i];hit([1.45,2.2,3.1,5.0][i],true);if(i===2)state.hp=Math.min(calcStats().maxHp,state.hp+calcStats().maxHp*.08);if(i===3)burstParticles(0xb764ff,40)}
function combatStep(dt){if(!auto)return;let st=calcStats();state.maxHp=st.maxHp;if(state.hp>state.maxHp)state.hp=state.maxHp;attackClock+=dt*speed;enemyClock+=dt*speed;for(let i=0;i<4;i++)skillCd[i]=Math.max(0,skillCd[i]-dt*speed);if(skillCd[0]<=0&&attackClock>=1/st.aps){attackClock=0;hit(1);skillCd[0]=.1}if(state.tempo>80&&skillCd[3]<=0)useSkill(3);else if(state.tempo>45&&skillCd[2]<=0)useSkill(2);else if(state.tempo>25&&skillCd[1]<=0)useSkill(1);if(enemyClock>=Math.max(.65,1.75-enemy.level*.001)){enemyClock=0;hurt(enemy.attack*(.85+Math.random()*.3))}}
function applyOffline(sec){sec=Math.min(sec,8*3600);let st=calcStats(),enc=Math.max(2.2,9/(st.power/(50+state.stage*8))),kills=Math.floor(sec/enc*.75);kills=Math.min(kills,6000);let gold=kills*(10+state.stage*2),xp=kills*(24+state.stage*3);state.gold+=gold;state.xp+=xp;state.stats.offline+=sec;state.stats.kills+=kills;let stages=Math.min(Math.floor(kills/9),Math.max(0,750-state.stage));state.stage+=stages;state.highest=Math.max(state.highest,state.stage);state.stats.stages+=stages;while(state.xp>=xpNeed(state.level)){state.xp-=xpNeed(state.level);state.level++}setTimeout(()=>toast('Offline: '+Math.floor(sec/60)+' min · '+fmt(gold)+' oro · '+kills+' enemigos'),700)}
function prestige(){if(state.highest<150)return toast('Prestigio se desbloquea tras stage 150');let gain=Math.max(1,Math.floor(Math.pow(Math.max(0,(state.highest-120)/25),1.45)));if(!confirm('Rebobinar el Reel por '+gain+' Fragmentos de Continuidad?'))return;state.cf+=gain;state.prestige++;state.stage=1;state.level=1;state.xp=0;state.gold=0;state.hp=180;state.inventory=state.inventory.filter(x=>x.rarity===7);state.equip={};worldBuilt=-1;spawn();save();closeModal();toast('Prestigio '+state.prestige+' · +'+gain+' Fragmentos')}
function renderShell(){const w=worldIndex();app.innerHTML=`<header><div class="profile"><div class="avatar">⚙️</div><div><b>MARA VELL</b><small>Lv. <span id="top-level">${state.level}</span> · Prestigio ${state.prestige}</small></div></div><button class="topbtn" data-open="character"><i>✦</i>Personaje</button><button class="topbtn" data-open="inventory"><i>▦</i>Inventario</button><button class="topbtn" data-open="skills"><i>✧</i>Habilidades</button><div class="logo">GLOAMGEAR<small>THE UNENDING REEL</small></div><button class="topbtn" data-open="missions"><i>☰</i>Misiones</button><button class="topbtn" data-open="worlds"><i>◉</i>Mundos</button><button class="topbtn" data-open="achievements"><i>★</i>Logros</button><button class="topbtn" data-open="prestige"><i>✹</i>Prestigio</button><div class="currency"><div class="coin">◉ <b id="gold">${fmt(state.gold)}</b></div><div class="coin gem">◆ <b id="gleam">${fmt(state.gleam)}</b></div></div></header>

function worldCard(i){let open=i<=Math.floor((state.highest-1)/50);return `<div class="world-card ${i===worldIndex()?'current':''} ${open?'':'locked'}" data-world="${i}"><div class="world-art"></div><span class="num">${String(i+1).padStart(2,'0')}</span><div class="txt"><b>${WORLDS[i][0]}</b>${WORLDS[i][1]}</div></div>`}
function bindUI(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openModal(b.dataset.open));document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>useSkill(+b.dataset.skill));document.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>{let i=+b.dataset.world;if(i<=Math.floor((state.highest-1)/50)){state.stage=i*50+1;worldBuilt=-1;spawn();renderShell();requestAnimationFrame(init3D)}});document.getElementById('auto').onclick=()=>{auto=!auto;document.getElementById('auto').textContent='AUTO '+(auto?'ON':'OFF')};document.getElementById('speed').onclick=()=>{speed=speed===1?2:speed===2?3:1;document.getElementById('speed').textContent='×'+speed};window.addEventListener('keydown',e=>{let i=['q','w','e','r'].indexOf(e.key.toLowerCase());if(i>=0)useSkill(i)},{once:false})}
function renderHud(force=false){if(!document.getElementById('enemy-hp'))return;const st=calcStats();state.maxHp=st.maxHp;document.getElementById('enemy-hp').style.width=(enemy.hp/enemy.maxHp*100)+'%';document.getElementById('player-hp').style.width=(state.hp/st.maxHp*100)+'%';document.getElementById('tempo').style.width=state.tempo+'%';document.getElementById('hp-txt').textContent=fmt(state.hp)+' / '+fmt(st.maxHp);document.getElementById('enemy-name').textContent=enemy.name;document.getElementById('enemy-kind').textContent=enemy.kind.toUpperCase()+' · Lv '+enemy.level;document.getElementById('level').textContent=state.level;document.getElementById('top-level').textContent=state.level;document.getElementById('gold').textContent=fmt(state.gold);document.getElementById('gleam').textContent=fmt(state.gleam);document.getElementById('stage-name').textContent='Stage '+state.stage+' / 750';document.getElementById('stage-progress').style.width=(localStage()*2)+'%';document.getElementById('world-name').textContent=String(worldIndex()+1).padStart(2,'0')+'. '+WORLDS[worldIndex()][0];for(let i=0;i<4;i++){let max=[2.8,5.2,7.5,12][i];document.getElementById('cd'+i)?.style.setProperty('--cd',(skillCd[i]/max*100)+'%')}document.getElementById('log').innerHTML=logs.map(x=>`<span class="${x.cls}">${x.t}</span>`).join('');if(force){document.getElementById('world-list').innerHTML=WORLDS.map((x,i)=>worldCard(i)).join('');document.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>{let i=+b.dataset.world;if(i<=Math.floor((state.highest-1)/50)){state.stage=i*50+1;worldBuilt=-1;spawn();renderShell();requestAnimationFrame(init3D)}})}}
function openModal(type){modal=type;let title='',body='';if(type==='inventory'){title='Inventario y equipo';body=inventoryHtml()}else if(type==='character'){title='Mara Vell — personaje';body=characterHtml()}else if(type==='skills'){title='Árbol de habilidades';body=skillsHtml()}else if(type==='masteries'){title='Maestrías';body=masteriesHtml()}else if(type==='missions'){title='Misiones';body=missionsHtml()}else if(type==='achievements'){title='Logros';body=achievementsHtml()}else if(type==='prestige'){title='Prestigio / Rebobinado';body=prestigeHtml()}else if(type==='worlds'){title='Mapa de los 15 mundos';body=worldsHtml()}const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=`<div class="window"><div class="winhead"><h2>${title}</h2><button class="close" id="close">Cerrar</button></div><div class="winbody">${body}</div></div>`;app.appendChild(m);document.getElementById('close').onclick=closeModal;bindModal(type)}
function closeModal(){document.getElementById('modal')?.remove();modal=''}
function inventoryHtml(){let eq=SLOTS.map(s=>`<div class="slot"><b>${s}</b>${state.equip[s]?state.equip[s].name+'<br><small>Power '+state.equip[s].power+'</small>':'Vacío'}</div>`).join('');let inv=state.inventory.length?state.inventory.map((x,i)=>`<div class="card"><span class="rarity" style="color:${RARC[x.rarity]}">${RAR[x.rarity]}</span><h3>${x.name}</h3><p>${x.slot} · Power ${x.power}</p><button class="btn" data-equip="${i}">Equipar</button> <button class="btn" data-sell="${i}">Vender</button></div>`).join(''):'<div class="card"><h3>Inventario vacío</h3><p>El combate automático irá llenándolo de objetos.</p></div>';return `<h3>Equipo</h3><div class="equip">${eq}</div><h3>Botín</h3><div class="grid">${inv}</div>`}
function characterHtml(){let st=calcStats();return `<div class="grid"><div class="card"><div class="big">MARA VELL</div><p>Cortadora de fotogramas · Nivel ${state.level}</p><p>Stage máximo: ${state.highest}</p><p>Prestigios: ${state.prestige}</p></div><div class="card"><h3>Estadísticas</h3><p>ATQ ${fmt(st.atk)}</p><p>Vida ${fmt(st.maxHp)}</p><p>Armadura ${fmt(st.armor)}</p><p>Vel. ataque ${st.aps.toFixed(2)}</p><p>Crítico ${(st.crit*100).toFixed(1)}%</p><p>Power ${fmt(st.power)}</p></div><div class="card"><h3>Framecutter</h3><p>Sable-herramienta modular. En el combate 3D se anima con tres arcos de ataque, estocada y descarga de energía.</p></div><div class="card"><h3>Estadísticas históricas</h3><p>Enemigos ${fmt(state.stats.kills||0)}</p><p>Bosses ${state.stats.boss||0}</p><p>Daño ${fmt(state.stats.damage||0)}</p><p>Crítico máximo ${fmt(state.stats.crit||0)}</p></div></div>`}
function skillsHtml(){return `<div class="tree"><div class="tree-grid">${BRANCHES.map((b,i)=>Array.from({length:5},(_,n)=>{let lv=state.skills[i],idx=n+1;return `<div class="node ${lv>=idx?'bought':''}" data-node="${i}" title="${b[1]}"><div><b>${b[0]}</b><br>${idx}/5</div></div>`}).join('')).join('')}</div></div><p style="font-size:10px;color:#b8aa92">Haz clic en nodos para invertir oro. Cada compra altera el combate real, daño, supervivencia o velocidad.</p>`}
function masteriesHtml(){let names=['Sword','Ranged','Arcane','Critical','Fire','Poison','Summoner','Defense','Treasure','AFK','Boss','Movement'];return `<div class="grid">${names.map((n,i)=>`<div class="card"><h3>${n} Mastery</h3><div class="big">${state.masteries[i]||0}</div><p>de 20 niveles base · Paragon después</p><button class="btn" data-mastery="${i}">Entrenar</button></div>`).join('')}</div>`}
function missionsHtml(){let d=Math.min(3,state.stats.stages%4),k=Math.min(100,state.stats.kills%101);return `<div class="grid"><div class="card"><h3>Diaria — Corta tres escenas</h3><p>Completa 3 stages: ${d}/3</p><button class="btn" ${d<3?'disabled':''} data-claim="daily">Reclamar</button></div><div class="card"><h3>Semanal — Cazador de residuo</h3><p>Derrota 100 enemigos: ${k}/100</p><button class="btn" ${k<100?'disabled':''} data-claim="weekly">Reclamar</button></div><div class="card"><h3>Boss</h3><p>Derrota al boss del mundo actual.</p><p>Recompensa: boss chest + fragmento.</p></div></div>`}
function achievementsHtml(){let a=[['First Cut',state.stats.kills>=1],['Critical Timing',(state.stats.crit||0)>0],['Stage 100',state.highest>=100],['Stage 500',state.highest>=500],['Foreman Down',state.stats.boss>=1],['All Fifteen',state.stats.boss>=15],['First Legendary',state.inventory.some(x=>x.rarity>=4)],['Unique Taste',state.inventory.some(x=>x.rarity===7)],['Loop Again',state.prestige>=1],['Loop Ten',state.prestige>=10]];return `<div class="grid">${a.map(([n,ok])=>`<div class="card"><h3>${ok?'★':'☆'} ${n}</h3><p>${ok?'COMPLETADO':'En progreso'}</p></div>`).join('')}</div>`}
function prestigeHtml(){let gain=Math.max(0,Math.floor(Math.pow(Math.max(0,(state.highest-120)/25),1.45)));return `<div class="grid"><div class="card"><h3>Rebobinado voluntario</h3><div class="big">${gain}</div><p>Fragmentos de Continuidad al reiniciar.</p><button class="btn primary" id="do-prestige" ${state.highest<150?'disabled':''}>REBOBINAR</button></div><div class="card"><h3>Conservas</h3><p>Maestrías, codex, logros, Fragmentos y objetos Unique.</p></div><div class="card"><h3>Se reinicia</h3><p>Stage, nivel, oro normal y equipo no fijado.</p></div></div>`}
function worldsHtml(){return `<div class="grid">${WORLDS.map((w,i)=>`<div class="card"><h3>${String(i+1).padStart(2,'0')}. ${w[0]}</h3><p>${w[1]}</p><p>${w[2]}</p><p>Boss: ${w[3]}</p></div>`).join('')}</div>`}
function bindModal(type){if(type==='inventory'){document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{let x=state.inventory[+b.dataset.equip];if(!x)return;state.equip[x.slot]=x;save();closeModal();openModal('inventory');toast(x.name+' equipado')});document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{let i=+b.dataset.sell,x=state.inventory[i];if(!x)return;state.gold+=x.power*3;state.inventory.splice(i,1);save();closeModal();openModal('inventory')})}if(type==='skills')document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{let i=+b.dataset.node,cost=Math.round(150*Math.pow(1.6,state.skills[i]));if(state.skills[i]>=5)return toast('Rama base completada');if(state.gold<cost)return toast('Necesitas '+fmt(cost)+' oro');state.gold-=cost;state.skills[i]++;save();closeModal();openModal('skills');toast(BRANCHES[i][0]+' mejorado')});if(type==='masteries')document.querySelectorAll('[data-mastery]').forEach(b=>b.onclick=()=>{let i=+b.dataset.mastery,cost=1000*(1+state.masteries[i]);if(state.gold<cost)return toast('Necesitas '+fmt(cost)+' oro');state.gold-=cost;state.masteries[i]=Math.min(20,state.masteries[i]+1);save();closeModal();openModal('masteries')});if(type==='prestige')document.getElementById('do-prestige')?.addEventListener('click',prestige);document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{state.gleam+=5;state.gold+=500;toast('Recompensa reclamada');save();closeModal()})}
function toast(t){document.querySelector('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function damagePop(d,crit){let v=document.getElementById('view');if(!v)return;let p=document.createElement('div');p.className='damage-pop';p.textContent=(crit?'✦ ':'')+fmt(d);p.style.left=(60+Math.random()*12)+'%';p.style.top=(35+Math.random()*18)+'%';if(crit)p.style.color='#ffd265';v.appendChild(p);setTimeout(()=>p.remove(),800);let f=document.getElementById('flash');if(f){f.classList.remove('hit');void f.offsetWidth;f.classList.add('hit')}}

function init3D(){const host=document.getElementById('view');if(!host)return;if(renderer){renderer.dispose();renderer.domElement.remove()}scene3d=new THREE.Scene();scene3d.fog=new THREE.FogExp2(0x0b0d14,.045);camera=new THREE.PerspectiveCamera(38,host.clientWidth/host.clientHeight,.1,200);camera.position.set(0,5.4,13.5);camera.lookAt(0,2.4,0);renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(host.clientWidth,host.clientHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;renderer.outputColorSpace=THREE.SRGBColorSpace;host.prepend(renderer.domElement);const hemi=new THREE.HemisphereLight(0x657da8,0x351a12,1.5);scene3d.add(hemi);let key=new THREE.DirectionalLight(0xffcf9a,3.2);key.position.set(-4,9,6);key.castShadow=true;scene3d.add(key);let rim=new THREE.PointLight(0xff3b2f,30,18,2);rim.position.set(4,3,-1);scene3d.add(rim);let blue=new THREE.PointLight(0x396cff,22,18,2);blue.position.set(-5,5,-4);scene3d.add(blue);buildEnvironment();buildMara();buildFoe();window.onresize=resize3D;requestAnimationFrame(animate3D)}
function mat(c,rough=.5,metal=.2,em=0){let m=new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal,emissive:em||0x000000,emissiveIntensity:em?1.3:0});flashMat.push(m);return m}
function mesh(g,m,x=0,y=0,z=0){let o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;return o}
function gear(radius=.6,teeth=12,color=0xb4772f){let g=new THREE.Group(),ring=mesh(new THREE.TorusGeometry(radius,.11,8,28),mat(color,.35,.75));ring.rotation.x=Math.PI/2;g.add(ring);for(let i=0;i<teeth;i++){let a=i/teeth*Math.PI*2,t=mesh(new THREE.BoxGeometry(.18,.12,.26),mat(color,.35,.75));t.position.set(Math.cos(a)*radius,0,Math.sin(a)*radius);t.rotation.y=-a;g.add(t)}return g}
function buildEnvironment(){if(env)scene3d.remove(env);env=new THREE.Group();scene3d.add(env);worldBuilt=worldIndex();const wi=worldBuilt;const palettes=[[0x1e2436,0x3a1816,0xc17a2a],[0x17343c,0x3a1b2f,0xe4a84b],[0x13352e,0x30192f,0x85a04b],[0x312c2a,0x1b2f4a,0xc7a65a],[0x15263d,0x19191f,0xd8b12d],[0x262044,0x341c35,0xa97ab4],[0x241319,0x681812,0xe45a20],[0x12323b,0x1f3754,0x78d8df],[0x24361d,0x431e29,0x94b85a],[0x262521,0x133339,0xc08345],[0x283249,0x6a5d4c,0xe3c16d],[0x121a37,0x312344,0x8970b0],[0x3b1419,0x2c2322,0xb33b3e],[0x27241e,0x18251f,0xd0b45a],[0x171420,0x28133b,0xe8dcad]][wi];scene3d.background=new THREE.Color(palettes[0]);scene3d.fog.color=new THREE.Color(palettes[0]);let floor=mesh(new THREE.PlaneGeometry(40,24),mat(0x16171b,.28,.55),0,0,0);floor.rotation.x=-Math.PI/2;env.add(floor);let grid=new THREE.GridHelper(30,30,0x8c642f,0x2b2b2f);grid.position.y=.012;env.add(grid);let moon=mesh(new THREE.SphereGeometry(3.2,28,20),new THREE.MeshBasicMaterial({color:wi===14?0xc8a9ff:0xffdba0}),0,8,-18);env.add(moon);for(let i=0;i<24;i++){let h=2+((i*17)%7)*.75,x=-14+i*1.2,z=-8-((i*7)%4),tower=mesh(new THREE.BoxGeometry(.75,h,.7),mat(i%3?0x10141c:palettes[1],.85,.1),x,h/2,z);env.add(tower);let spire=mesh(new THREE.ConeGeometry(.48,1.4,5),mat(0x0b0d13,.8,.15),x,h+.7,z);env.add(spire);if(i%2===0){let win=mesh(new THREE.BoxGeometry(.18,.16,.05),new THREE.MeshBasicMaterial({color:palettes[2]}),x,h*.6,z+.37);env.add(win)}}for(let i=0;i<6;i++){let lamp=new THREE.Group();let post=mesh(new THREE.CylinderGeometry(.045,.07,2.4,7),mat(0x2a2119,.4,.7),0,1.2,0);lamp.add(post);let bulb=mesh(new THREE.SphereGeometry(.15,8,8),new THREE.MeshBasicMaterial({color:0xffaa42}),0,2.3,0);lamp.add(bulb);lamp.position.set(-8+i*3.2,0,-2.2-(i%2)*.5);env.add(lamp)}for(let i=0;i<4;i++){let g=gear(.7+i*.08,12,0x8b5d2d);g.position.set(-6+i*4,1.5+((i*3)%2),-5);g.rotation.z=i*.4;env.add(g)}let arch=mesh(new THREE.TorusGeometry(7,0.25,10,42,Math.PI),mat(0x382719,.7,.45),0,4,-6);arch.rotation.z=Math.P function buildMara(){if(mara)scene3d.remove(mara.root);const skin=mat(0xe7b58d,.65,.05),black=mat(0x111117,.55,.15),red=mat(0x8b1f32,.5,.15),cream=mat(0xe8d8b8,.75,.05),brass=mat(0xc58a36,.3,.85),white=mat(0xf7f1de,.5,.05);let root=new THREE.Group();root.position.set(-3.6,0,0);let hips=new THREE.Group();hips.position.y=1.6;root.add(hips);let torso=mesh(new THREE.CapsuleGeometry(.47,.85,6,10),red,0,.55,0);torso.scale.z=.78;hips.add(torso);let bib=mesh(new THREE.BoxGeometry(.42,.7,.12),cream,0,.62,.39);hips.add(bib);let head=mesh(new THREE.SphereGeometry(.54,18,14),skin,0,1.75,0);head.scale.set(1,1.06,.92);hips.add(head);let hairBack=mesh(new THREE.SphereGeometry(.6,16,12),black,0,1.86,-.12);hairBack.scale.set(1.08,.74,.88);hips.add(hairBack);head.renderOrder=2;let hairFront=mesh(new THREE.SphereGeometry(.4,14,10),black,-.2,2.06,.28);hairFront.scale.set(1.25,.35,.6);hips.add(hairFront);for(let sx of [-1,1]){let eye=mesh(new THREE.SphereGeometry(.075,10,8),white,sx*.17,1.82,.49);hips.add(eye);let pupil=mesh(new THREE.SphereGeometry(.035,8,6),black,sx*.17,1.82,.555);hips.add(pupil)}let goggleBand=mesh(new THREE.TorusGeometry(.28,.05,6,18),brass,0,2.16,.06);goggleBand.rotation.x=Math.PI/2;goggleBand.scale.x=1.5;hips.add(goggleBand);let scarf=mesh(new THREE.BoxGeometry(.22,.95,.08),red,-.42,1.45,-.3);scarf.rotation.z=.55;hips.add(scarf);let cape=mesh(new THREE.ConeGeometry(.75,1.5,4,1,true),red,-.35,.5,-.55);cape.rotation.z=-.18;cape.rotation.x=-.22;hips.add(cape);let lArm=new THREE.Group(),rArm=new THREE.Group();lArm.position.set(-.52,.95,0);rArm.position.set(.52,.95,0);hips.add(lArm,rArm);for(let a of [lArm,rArm]){a.add(mesh(new THREE.CapsuleGeometry(.12,.55,4,8),skin,0,-.25,0));a.children[0].rotation.z=a===lArm?-.25:.25;let glove=mesh(new THREE.SphereGeometry(.17,10,8),black,0,-.63,0);a.add(glove)}let lLeg=new THREE.Group(),rLeg=new THREE.Group();lLeg.position.set(-.23,1.55,0);rLeg.position.set(.23,1.55,0);root.add(lLeg,rLeg);for(let leg of [lLeg,rLeg]){let thigh=mesh( function buildFoe(){if(!scene3d)return;if(foe)scene3d.remove(foe.root);const k=enemy.kind,boss=k==='boss',mini=k==='miniboss'||k==='elite',scale=boss?1.65:mini?1.25:1;let root=new THREE.Group();root.position.set(3.5,0,-.2);root.scale.setScalar(scale);let metal=mat(0x49311f,.38,.78),black=mat(0x111217,.55,.35),red=mat(0x7e1928,.48,.2),bone=mat(0xe4d3b0,.7,.05),brass=mat(0xb87930,.3,.86),glow=new THREE.MeshStandardMaterial({color:0xff4436,emissive:0xff1300,emissiveIntensity:3});let body=mesh(new THREE.SphereGeometry(.72,16,12),boss?red:metal,0,1.65,0);body.scale.y=1.2;root.add(body);let head=mesh(new THREE.SphereGeometry(.48,16,12),bone,0,2.75,0);head.scale.set(1,.9,.75);root.add(head);for(let sx of [-1,1]){let eye=mesh(new THREE.SphereGeometry(.075,8,6),glow,sx*.17,2.79,.39);root.add(eye)}let hatBrim=mesh(new THREE.CylinderGeometry(.72,.72,.12,18),black,0,3.15,0);root.add(hatBrim);let hat=mesh(new THREE.CylinderGeometry(.42,.5,.78,16),black,0,3.5,0);root.add(hat);let band=mesh(new THREE.CylinderGeometry(.505,.505,.13,16),red,0,3.28,0);root.add(band);let lArm=new THREE.Group(),rArm=new THREE.Group();lArm.position.set(-.68,2.05,0);rArm.position.set(.68,2.05,0);root.add(lArm,rArm);for(let a of [lArm,rArm]){let arm=mesh(new THREE.CapsuleGeometry(.13,.85,4,8),metal,0,-.4,0);a.add(arm);arm.rotation.z=a===lArm?-.45:.45;let claw=gear(.24,8,0xb87930);claw.position.y=-.95;a.add(claw)}for(let sx of [-1,1]){let leg=mesh(new THREE.CapsuleGeometry(.16,.9,4,8),black,sx*.28,.65,0);leg.rotation.z=sx*.08;root.add(leg);let foot=mesh(new THREE.BoxGeometry(.48,.25,.68),metal,sx*.34,.12,.1);root.add(foot)}if(boss){for(let i=0;i<3;i++){let arm=new THREE.Group();arm.position.set((i-1)*.35,2.0,-.2);let seg=mesh(new THREE.CapsuleGeometry(.1,1.4,4,8),brass,0,.6,0);seg.rotation.z=(i-1)*.55;arm.add(seg);let claw=gear(.3,9,0xd2953d);claw.position.set((i-1)*.75,1.1,0);arm.add(claw);root.add(arm)}let cape=mesh(new THREE.ConeGeometry(1.2,2.4,5,1,true),red,0,1.35,-.45);cape.rotation.x=-.25;root.add(c function burstParticles(color,count=12){if(!scene3d||!foe)return;for(let i=0;i<count;i++){let p=mesh(new THREE.SphereGeometry(.025+Math.random()*.035,5,5),new THREE.MeshBasicMaterial({color}),3.0+Math.random()*.7,1.8+Math.random()*.7,.1);p.userData.v=new THREE.Vector3((Math.random()-.5)*4,(Math.random()*.7+1.2)*3,(Math.random()-.5)*3);p.userData.life=.45+Math.random()*.45;scene3d.add(p);particles.push(p)}}
function animate3D(t){if(!renderer||!document.body.contains(renderer.domElement))return;requestAnimationFrame(animate3D);const time=t*.001,dt=Math.min(.035,(t-last)/1000||.016);if(worldBuilt!==worldIndex())buildEnvironment();if(mara){mara.hips.position.y=1.6+Math.sin(time*3)*.045;mara.cape.rotation.z=-.18+Math.sin(time*2.2)*.08;mara.lArm.rotation.z=Math.sin(time*3)*.05;mara.lLeg.rotation.z=Math.sin(time*2)*.035;mara.rLeg.rotation.z=-Math.sin(time*2)*.035;if(animAttack>0){animAttack=Math.max(0,animAttack-dt*speed);let p=1-animAttack/.42,s=Math.sin(p*Math.PI);mara.root.position.x=-3.6+s*.8;mara.rArm.rotation.x=-1.3*s;mara.rArm.rotation.z=-2.2*s;mara.weapon.rotation.y=2.5*s}else{mara.root.position.x=-3.6;mara.rArm.rotation.x=0;mara.rArm.rotation.z=0;mara.weapon.rotation.y=0}}if(foe){foe.root.position.y=Math.sin(time*2.1)*.04;foe.head.rotation.y=Math.sin(time*1.7)*.12;foe.lArm.rotation.z=.1+Math.sin(time*2.4)*.08;foe.rArm.rotation.z=-.1-Math.sin(time*2.4)*.08;if(animEnemy>0){animEnemy=Math.max(0,animEnemy-dt*speed);let p=1-animEnemy/.34,s=Math.sin(p*Math.PI);foe.root.position.x=3.5-s*.45;foe.root.rotation.z=-s*.08}else{foe.root.position.x=3.5;foe.root.rotation.z=0}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.userData.life-=dt;p.position.addScaledVector(p.userData.v,dt);p.userData.v.y-=8*dt;p.scale.setScalar(Math.max(.01,p.userData.life*1.8));if(p.userData.life<=0){scene3d.remove(p);particles.splice(i,1)}}if(env){env.children.forEach((o,i)=>{if(o.type==='Group'&&i%2===0)o.rotation.y+=dt*.08})}let sx=(Math.random()-.5)*shake*.12,sy=(Math.random()-.5)*shake*.08;shake*=.86;camera.position.x=sx;camera.position.y=5.4+sy;camera.lookAt(0,2.35,0);renderer.render(scene3d,camera)}
