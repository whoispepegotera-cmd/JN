utton>`).join('')}</nav><div id="overlay"></div></div>`;$('#reset').onclick=()=>{if(confirm('¿Borrar la partida guardada en este navegador?')){localStorage.removeItem(KEY);localStorage.removeItem(META);location.reload()}};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>b.dataset.tab==='Battle'?close():open(b.dataset.tab));resize();window.addEventListener('resize',resize);hud()}
function resize(){let c=$('#c');if(!c)return;let r=c.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);c.width=r.width*d;c.height=r.height*d;c.getContext('2d').setTransform(d,0,0,d,0,0);draw()}
function draw(){let c=$('#c');if(!c)return;let x=c.getContext('2d'),r=c.getBoundingClientRect(),w=r.width,h=r.height,wi=world(),p=[['#201514','#7B2636','#C8903D'],['#19323a','#2D7475','#dba447'],['#152c28','#4c3156','#e5dfc8'],['#17263c','#34558a','#e5d8b4'],['#14243a','#d3a51f','#0b0d10'],['#201c3d','#c27b9e','#b5b6cc'],['#120f12','#8d2632','#df6937'],['#12343b','#74b7bd','#d29d4d'],['#24351b','#6c293e','#d9d0aa'],['#19191a','#9f754c','#245b5b'],['#d3e4e1','#5aacc3','#c69b49'],['#101a30','#7d6798','#c2c9d4'],['#3a1418','#2a1717','#ad8c55'],['#121213','#756b4c','#445f50'],['#100d17','#6B4C8A','#FFF7DA']][wi],g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,p[0]);g.addColorStop(.65,'#101116');g.addColorStop(1,'#07080a');x.fillStyle=g;x.fillRect(0,0,w,h);x.globalAlpha=.45;x.fillStyle=p[1];for(let i=0;i<14;i++){let bw=25+(i%4)*14,bh=h*(.15+.3*((i*37)%100)/100);x.fillRect(i*w/13-bw/2,h*.7-bh,bw,bh)}x.globalAlpha=1;x.fillStyle='#15161a';x.fillRect(0,h*.72,w,h*.28);x.strokeStyle='#c8903d44';x.beginPath();x.moveTo(0,h*.72);x.lineTo(w,h*.72);x.stroke();hero(x,w*.28,h*.76);foe(x,w*.72,h*.76,p)}
function hero(x,px,py){x.save();x.translate(px,py);x.lineWidth=4;x.strokeStyle='#08090b';x.fillStyle='#7B2636';x.beginPath();x.moveTo(-32,-105);x.lineTo(32,-105);x.lineTo(24,-35);x.lineTo(-26,-35);x.closePath();x.fill();x.stroke();x.fillStyle='#e8c69f';x.beginPath();x.arc(0,-135,27,0,7);x.fill();x.stroke();x.fillStyle='#17151a';x.beginPath();x.arc(-4,-147,29,Math.PI,Math.PI*2);x.fill();x.fillStyle='#C8903D';x.beginPath();x.arc(-30,-73,17,0,7);x.fill();x.stroke();x.strokeStyle='#C8903D';x.lineWidth=8;x.beginPath();x.moveTo(22,-75);x.lineTo(83,-142);x.stroke();x.strokeStyle='#FFF7DA';x.lineWidth=3;x.beginPath();x.moveTo(53,-110);x.lineTo(95,-153);x.stroke();x.restore()}
function foe(x,px,py,p){x.save();x.translate(px,py);let sc=enemy.k==='boss'?1.55:enemy.k==='miniboss'?1.25:enemy.k==='elite'?1.1:.9;x.scale(sc,sc);x.strokeStyle='#08090b';x.lineWidth=5;x.fillStyle=p[1];if(enemy.k==='boss'){x.beginPath();x.moveTo(-50,-120);x.quadraticCurveTo(0,-160,50,-120);x.lineTo(65,-40);x.quadraticCurveTo(0,10,-65,-40);x.closePath();x.fill();x.stroke();x.fillStyle='#111';x.beginPath();x.arc(0,-105,32,0,7);x.fill();x.stroke();x.fillStyle='#FFF7DA';x.beginPath();x.arc(-12,-108,5,0,7);x.arc(12,-108,5,0,7);x.fill()}else{x.beginPath();x.roundRect(-40,-100,80,78,16);x.fill();x.stroke();x.fillStyle='#111';x.beginPath();x.arc(-13,-70,5,0,7);x.arc(13,-70,5,0,7);x.fill()}x.restore()}
function hud(){if(!enemy)return;let st=stats(),wi=world();$('#tw').textContent=(wi+1)+' · '+W[wi][0];$('#ts').textContent=s.stage;$('#tl').textContent=s.level;$('#tg').textContent=fmt(s.gold);$('#hptext').textContent=fmt(Math.max(0,s.hp))+' / '+fmt(st.hp);$('#hpbar').style.width=clamp(s.hp/st.hp*100,0,100)+'%';$('#xptext').textContent=fmt(s.xp)+' / '+fmt(xpReq());$('#xpbar').style.width=clamp(s.xp/xpReq()*100,0,100)+'%';$('#power').textContent=fmt(st.power);$('#atk').textContent=fmt(st.atk);$('#aps').textContent=st.aps.toFixed(2);$('#crit').textContent=(st.crit*100).toFixed(1)+'%';$('#prest').textContent=s.prestige+' · '+s.cf+' CF';$('#kind').textContent=enemy.k;$('#ename').textContent=enemy.name;$('#ehp').textContent=fmt(Math.max(0,enemy.hp))+' / '+fmt(enemy.max);$('#ehpbar').style.width=clamp(enemy.hp/enemy.max*100,0,100)+'%';$('#wl').textContent=W[wi][0]+' · '+ls()+'/50';$('#kl').textContent=enemy.k==='normal'?enemy.kills+'/4 CUTS':enemy.k.toUpperCase();$('#stitle').textContent='Stage '+s.stage;$('#mech').textContent=W[wi][3];$('#bio').textContent=W[wi][1]+' · '+W[wi][2];draw()}
function log(t,c=''){logs.unshift(`<div class="${c}">${t}</div>`);logs=logs.slice(0,7);let el=$('#log');if(el)el.innerHTML=logs.join('')}function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function win(title,body){return `<div class="overlay"><section class="window"><div class="winhead"><h2>${title}</h2><button class="navbtn" id="back">Volver al combate</button></div><div class="winbody">${body}</div></section></div>`} function close(){overlay='';$('#overlay').innerHTML='';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab==='Battle'))}
function open(n){overlay=n;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===n));let b=n==='Inventory'?inventory():n==='Skills'?skills():n==='Worlds'?worlds():n==='Prestige'?prestige():codex();$('#overlay').innerHTML=win(n,b);$('#back').onclick=close;bind(n)}
function inventory(){let eq=SLOTS.map(sl=>`<div class="slot"><b>${sl}</b>${s.equip[sl]?s.equip[sl].name+'<br>'+s.equip[sl].r+' · '+fmt(s.equip[sl].pow):'Empty'}</div>`).join('');let cards=s.inventory.slice(0,300).map(i=>`<article class="card"><div class="rarity" style="color:${RC[R.indexOf(i.r)]}">${i.r}</div><h3>${i.name}</h3><p>${i.slot} · Power ${fmt(i.pow)}</p><p>ATK +${fmt(i.atk)} · HP +${fmt(i.hp)} · ARM +${fmt(i.arm)}</p><div class="actions"><button class="btn primary" data-eq="${i.id}">Equipar</button><button class="btn" data-sell="${i.id}">Vender</button></div></article>`).join('')||'<p>El inventario está vacío.</p>';return `<div class="equip">${eq}</div><div class="grid">${cards}</div>`}
function skills(){return `<p>Skill points: <b style="color:var(--brass)">${s.skill}</b></p><div class="skillrow">${SK.map((k,i)=>`<article class="card skill"><h3>${k[0]}</h3><p>${k[1]}</p><div class="big">${s.skills[i]}</div><button class="btn primary" data-sk="${i}" ${s.skill<=0?'disabled':''}>Subir</button></article>`).join('')}</div>`}
function worlds(){return `<div class="grid">${W.map((w,i)=>{let start=i*50+1,end=(i+1)*50,u=s.highest>=start,cur=world()===i;return `<article class="card world ${u?'':'locked'} ${cur?'current':''}"><div class="rarity">WORLD ${i+1}</div><h3>${w[0]}</h3><p>${w[1]} · ${w[2]}</p><p><b>Boss:</b> ${w[4]}</p><p>${w[3]}</p>${u?`<button class="btn" data-jump="${Math.min(s.highest,end)}">Ir al último stage</button>`:''}</article>`}).join('')}</div>`}
function prestige(){let r=Math.floor(Math.pow(Math.max(0,(s.highest-120)/25),1.45)*(1+.08*s.stats.boss));return `<div class="card" style="max-width:760px;margin:auto;text-align:center"><h3>Rebobinado Voluntario</h3><p>Reinicia nivel, stage, oro e inventario salvo Uniques; conserva mejoras de continuidad.</p><div class="big">+${r}</div><p>Fragmentos de Continuidad</p><p>Highest Stage ${s.highest} · Bosses ${s.stats.boss} · Prestiges ${s.prestige}</p><button class="btn primary" id="prestige" ${r<=0?'disabled':''}>REBOBINAR REALIDAD</button></div>`}
function codex(){return `<div class="grid"><article class="card"><h3>Campaña</h3><p>15 mundos · 750 stages · 15 bosses principales.</p></article><article class="card"><h3>Protagonista</h3><p>Mara Vell · Framecutter · restauradora atrapada entre Reels.</p></article><article class="card"><h3>Buildcraft</h3><p>6 ramas de habilidades, equipo procedural, prestige y progreso offline.</p></article></div><h3 style="color:var(--brass)">Boss Codex</h3><div class="grid">${W.map((w,i)=>`<article class="card"><div class="rarity">WORLD ${i+1}</div><h3>${w[4]}</h3><p>${w[3]}</p></article>`).join('')}</div>`}
function bind(n){if(n==='Inventory'){document.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{let id=b.dataset.eq,i=s.inventory.findIndex(x=>x.id===id),it=s.inventory[i];if(!it)return;let old=s.equip[it.slot];s.equip[it.slot]=it;s.inventory.splice(i,1);if(old)s.inventory.unshift(old);s.hp=Math.min(s.hp,stats().hp);save();open('Inventory')});document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{let i=s.inventory.findIndex(x=>x.id===b.dataset.sell);if(i>=0){s.gold+=Math.round(s.inventory[i].pow*.35);s.inventory.splice(i,1);save();open('Inventory')}})}if(n==='Skills')document.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{let i=+b.dataset.sk;if(s.skill>0){s.skill--;s.skills[i]++;save();open('Skills')}});if(n==='Worlds')document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{s.stage=+b.dataset.jump;spawn();save();close()});if(n==='Prestige')$('#prestige').onclick=()=>{let r=Math.floor(Math.pow(Math.max(0,(s.highest-120)/25),1.45)*(1+.08*s.stats.boss));if(r>0&&confirm('¿Rebobinar la realidad?')){s.cf+=r;s.prestige++;s.level=1;s.xp=0;s.gold=0;s.stage=1;s.inventory=s.inventory.filter(i=>i.r==='Unique');s.equip={};s.hp=stats().hp;spawn();save();close();toast('+'+r+' Fragmentos de Continuidad')}}}
function showOffline(sec,k,g,x,st){if(!app.querySelector('.app'))return;overlay='offline';$('#overlay').innerHTML=win('Proyección offline',`<div style="text-align:center"><p>Progreso calculado desde el último guardado de este navegador.</p><div class="big">${Math.floor(sec/3600)}h ${Math.floor(sec%3600/60)}m</div><div class="grid"><div class="card"><h3>${fmt(k)}</h3><p>Kills</p></div><div class="card"><h3>${fmt(g)}</h3><p>Gold</p></div><div class="card"><h3>${fmt(x)}</h3><p>XP</p></div><div class="card"><h3>+${st}</h3><p>Stages</p></div></div></div>`);$('#back').textContent='RECLAMAR Y JUGAR';$('#back').onclick=()=>{close();save()}}
function frame(now){let dt=Math.min(.1,(now-last)/1000);last=now;acc+=dt;saveT+=dt;if(!overlay)while(acc>=.05){tick(.05);acc-=.05}if(saveT>12){saveT=0;save()}hud();requestAnimationFrame(frame)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});window.addEventListener('beforeunload',save);load();requestAnimationFrame(frame);
})();
</script></body></html>
