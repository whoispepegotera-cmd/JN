</style></head><body><div id="root"></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js';
const worlds=['Fundición Ragtime','Paseo Azafrán','Pantano de Terciopelo','Parroquia de Porcelana','Ferrocarril del Trueno','Menagerie Lunar','Ópera de Ceniza','Costa de Cristal Salino','Huerto Torcido','Subsuelo de Marfil','Salón Nimbus','Observatorio del Luto','Archivo Escarlata','Corona Hueca','Última Proyección'];
const bosses=['Foreman Cadenza','Madame Carousel','Baron Croakveil','Saint Craceline','Conductor Voltgrave','Ringmaster Selene','Prima Incendia','Admiral Shardfin','Old Mother Graft','The Ossuary Engine','Duke Stratos','Astronomer Epitaph','Archivist Redacta','King Nobody','The Director Null'];
const enemyNames=['Sootling','Taffy Imp','Mire Mask','Chapel Doll','Rail Rat','Moon Ape','Ash Tenor','Glass Crab','Knotling','Key Gnat','Cloud Footman','Star Leech','Ink Clerk','Crownless','Null Frame'];
const slots=['Arma','Casco','Pecho','Guantes','Botas','Anillo','Amuleto','Reliquia'];
const itemNames=['Framecutter','Metronome of Red Hours','Cadenza Breaker','Carousel Teeth','Croakveil Tongue','Craceline Halo','Voltgrave Railgun','Selene’s Second Shadow','Incendia’s Curtain','Shardfin Broadside','Salt Memory','Glass Horizon','Red Curtain Heart','Key Without Lock','Moon Animal'];
const KEY='gloamgear_3d_v1';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{level:1,xp:0,gold:0,gleam:0,stage:1,highest:1,hp:280,prestige:0,inventory:[],equip:{},skills:[0,0,0,0,0,0],kills:0,bosses:0,auto:true,speed:1,last:Date.now()};
let enemy={hp:100,max:100}; let overlay=''; let logs=[]; let attackTimer=0, enemyTimer=0, skillCD=[0,0,0,0], last=performance.now();
const fmt=n=>n<1e3?Math.floor(n):n<1e6?(n/1e3).toFixed(1)+'K':n<1e9?(n/1e6).toFixed(1)+'M':(n/1e9).toFixed(1)+'B';
const widx=()=>Math.min(14,Math.floor((state.stage-1)/50)); const localStage=()=>((state.stage-1)%50)+1; const isBoss=()=>localStage()===50; const isMini=()=>localStage()===25; const pmax=()=>280+state.level*18+state.prestige*60; const attack=()=>22+state.level*5+state.skills[5]*8+Object.keys(state.equip).length*8+state.prestige*22;
const root=document.querySelector('#root');
function save(){state.last=Date.now();localStorage.setItem(KEY,JSON.stringify(state));const e=document.querySelector('#save');if(e)e.textContent='GUARDADO ✓'}
function log(t,c=''){logs.unshift({t,c});logs=logs.slice(0,6)}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2100)}
function spawn(){const scale=Math.pow(1.09,state.stage-1)*(isBoss()?7:isMini()?3:1);enemy.max=Math.round(70*scale);enemy.hp=enemy.max;enemy.name=isBoss()?bosses[widx()]:isMini()?'Miniboss de '+worlds[widx()]:enemyNames[widx()];enemy.kind=isBoss()?'BOSS':isMini()?'MINIBOSS':'ENEMIGO'}
function offline(){const sec=Math.max(0,Math.min(28800,(Date.now()-state.last)/1000));if(sec>60){const kills=Math.floor(sec/8);const gold=Math.floor(kills*(7+state.level*1.8));state.gold+=gold;state.xp+=kills*5;state.kills+=kills;toast(`Progreso offline: +${fmt(gold)} oro · ${kills} enemigos`)}}
function gainXP(x){state.xp+=x;const need=100*Math.pow(state.level,1.35);if(state.xp>=need){state.xp-=need;state.level++;state.hp=pmax();log('SUBES A NIVEL '+state.level,'crit');burst('level');toast('Nivel '+state.level+' alcanzado')}}
function drop(){if(Math.random()<.42){const rarity=Math.random()<.03?'Legendario':Math.random()<.16?'Épico':'Raro';const it={id:Date.now()+Math.random(),name:itemNames[Math.floor(Math.random()*itemNames.length)],rarity,power:Math.round(8+state.level*4+Math.random()*20),slot:slots[Math.floor(Math.random()*slots.length)]};state.inventory.unshift(it);log('BOTÍN: '+it.name+' · '+rarity,'loot');burst('loot')}}
function kill(){state.kills++;state.gold+=Math.round(7+state.stage*1.6);gainXP(8+state.stage*.7);drop();if(isBoss()){state.bosses++;log('BOSS DERROTADO: '+enemy.name,'crit');state.stage++;state.highest=Math.max(state.highest,state.stage);burst('boss');toast('Mundo superado · '+worlds[widx()])}else{state.stage++;state.highest=Math.max(state.highest,state.stage)}spawn();syncEnemyModel();save()}
function hitEnemy(mult=1,critBoost=0){const crit=Math.random()<.16+critBoost;const dmg=Math.round(attack()*mult*(crit?1.85:1)*(0.9+Math.random()*.2));enemy.hp=Math.max(0,enemy.hp-dmg);log((crit?'CRÍTICO ':'')+'Mara inflige '+dmg,crit?'crit':'');damagePop(dmg,crit);flash();maraAttack(crit?1.2:1);spark(true);if(enemy.hp<=0)kill()}
function enemyHit(){const dmg=Math.round((5+state.stage*.6)*(0.8+Math.random()*.35));state.hp=Math.max(0,state.hp-dmg);log(enemy.name+' golpea por '+dmg,'hurt');damagePop(dmg,false,true);enemyAttack();spark(false);if(state.hp<=0){state.hp=pmax();state.stage=Math.max(1,state.stage-1);log('Mara cae y retrocede una etapa','hurt');spawn();syncEnemyModel()}}
function useSkill(i){if(skillCD[i]>0)return;const mult=[1.7,2.2,1.35,3.1][i];skillCD[i]=[3.2,5,4.2,9][i];hitEnemy(mult,i===3?.35:.08);burst(['blue','fire','ice','void'][i])}
function prestige(){if(state.highest<120)return toast('El prestigio se desbloquea al superar la etapa 120');const reward=Math.max(1,Math.floor((state.highest-100)/25));state.prestige+=reward;state.stage=1;state.level=1;state.xp=0;state.gold=0;state.hp=pmax();spawn();syncEnemyModel();overlay='';renderUI();toast('Prestigio +'+reward+' Fragmentos de Continuidad')}
function renderUI(){const wi=widx(),ls=localStage(),xpNeed=100*Math.pow(state.level,1.35);root.innerHTML=`<div class="app"><div class="curtain l"></div><div class="curtain r"></div><header><div class="profile"><div class="avatar">⚙️</div><div><b>MARA VELL</b><small>Nivel ${state.level} · Prestigio ${state.prestige}</small></div></div><button class="topbtn" data-open="character"><i>♟</i>Personaje</button><button class="topbtn" data-open="inventory"><i>🎒</i>Inventario</button><div class="logo">GLOAMGEAR<small>THE UNENDING REEL</small></div><button class="topbtn" data-open="worlds"><i>🗺</i>Mundos</button><button class="topbtn" data-open="skills"><i>✦</i>Maestrías</button><button class="topbtn" data-open="prestige"><i>⟳</i>Prestigio</button><div class="currency"><div class="coin">🪙 <b>${fmt(state.gold)}</b></div><div class="coin gem">◆ <b>${fmt(state.gleam)}</b></div></div></header><div class="main"><section class="panel"><div class="panel-title">Los 15 mundos</div><div class="panel-body">${worlds.map((w,i)=>`<div class="world-card ${i===wi?'current':''} ${i>Math.floor((state.highest-1)/50)?'locked':''}" data-world="${i}"><div class="world-art"></div><span class="num">${String(i+1).padStart(2,'0')}</span><div class="txt"><b>${w}</b>Etapas ${i*50+1}–${i*50+50}</div></div>`).join('')}</div></section><section class="center"><div class="stagebar"><b>${String(wi+1).padStart(2,'0')}. ${worlds[wi].toUpperCase()}</b><small>Etapa ${state.stage} · ${enemy.kind}</small><div class="nodes"><i style="width:${ls*2}%"></i></div><span class="bossmark">☠</span></div><div class="view"><canvas id="game3d"></canvas><div class="hud-overlay"><div class="boss-hud"><div class="name">${enemy.name}</div><div class="sub">${enemy.kind} · ${worlds[wi]}</div><div class="boss-hp"><i id="ehp" style="width:${enemy.hp/enemy.max*100}%"></i></div></div><div class="player-hud"><div class="face">⚙️</div><div class="bars"><small>MARA VELL · HP ${Math.round(state.hp)} / ${pmax()}</small><div class="player-hp"><i id="php" style="width:${state.hp/pmax()*100}%"></i></div><small>XP ${Math.floor(state.xp)} / ${Math.floor(xpNeed)}</small><div class="resource"><i style="width:${Math.min(100,state.xp/xpNeed*100)}%"></i></div></div></div><div class="flash" id="flash"></div></div></div><div class="combat-log"><div class="loglines" id="log">${logs.map(x=>`<span class="${x.c}">${x.t}</span>`).join('')}</div><div class="skills">${['⚡','🔥','❄','✦'].map((x,i)=>`<button class="skillorb" data-skill="${i}"><em>${x}</em><b>${['Q','W','E','R'][i]}</b><span class="cd" id="cd${i}"></span></button>`).join('')}</div></div></section><section class="rightcol"><div class="panel"><div class="panel-title">Mapa del mundo</div><div class="panel-body"><div class="map"><div class="mapline"></div><div class="mapnodes">${[10,20,30,40,50].map(n=>`<div class="mapnode ${ls>=n?'on':''}">${n===50?'☠':'✦'}</div>`).join('')}</div></div></div></div><div class="panel"><div class="panel-title">Botín de la etapa</div><div class="panel-body"><div class="lootgrid">${['🪙','⚙','◆','📜','◉','💎','⛭','🧪'].map(x=>`<div class="looticon">${x}</div>`).join('')}</div></div></div><div class="panel"><div class="panel-title">Enemigos de esta etapa</div><div class="panel-body"><div class="enemygrid">${[enemyNames[wi],isMini()?'Miniboss':'Élite',bosses[wi],enemy.name].map(x=>`<div class="enemyicon">${x}</div>`).join('')}</div></div></div></section></div><footer><button class="navbtn active"><i>⚔</i>Combate</button><button class="navbtn" data-open="inventory"><i>🎒</i>Inventario</button><button class="navbtn" data-open="character"><i>♟</i>Personaje</button><button class="navbtn" data-open="worlds"><i>🗺</i>Mapa mundial</button><button class="navbtn" data-open="skills"><i>✦</i>Árbol de habilidades</button><button class="navbtn" data-open="prestige"><i>⟳</i>Prestigio</button><span class="footer-spacer"></span><span id="save" style="font-size:9px;color:#94b690">GUARDADO ✓</span><button class="navbtn auto" id="auto">AUTO ${state.auto?'ON':'OFF'}</button><button class="navbtn" id="speed">x${state.speed}</button></footer></div>`;if(overlay)openOverlay(overlay,false);bindUI();init3D()}
function openOverlay(type,rebuild=true){overlay=type;if(rebuild&&document.querySelector('.modal'))document.querySelector('.modal').remove();const names={inventory:'Inventario',character:'Personaje y equipo',worlds:'Mapa de los 15 mundos',skills:'Árbol de habilidades',prestige:'Prestigio / Rebobinado'};const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="window"><div class="winhead"><h2>${names[type]}</h2><button class="close">Cerrar ✕</button></div><div class="winbody">${overlayBody(type)}</div></div>`;document.body.appendChild(m);m.querySelector('.close').onclick=()=>{overlay='';m.remove()};m.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>equip(Number(b.dataset.equip)));m.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>buyNode(Number(b.dataset.node)));const p=m.querySelector('#doPrestige');if(p)p.onclick=prestige}
function overlayBody(type){if(type==='inventory')return `<div class="equip">${slots.map(sl=>`<div class="slot"><b>${sl}</b>${state.equip[sl]?state.equip[sl].name:'Vacío'}</div>`).join('')}</div><div class="grid">${state.inventory.length?state.inventory.map((it,i)=>`<div class="card"><h3>${it.name}</h3><p>${it.rarity} · ${it.slot}</p><p>Poder +${it.power}</p><button class="btn" data-equip="${i}">Equipar</button></div>`).join(''):'<div class="card"><h3>Sin objetos aún</h3><p>Derrota enemigos para conseguir botín.</p></div>'}</div>`;if(type==='character')return `<div class="grid"><div class="card"><h3>Mara Vell · modelo 3D procedural</h3><p>ATQ ${attack()} · HP ${pmax()} · Nivel ${state.level}</p><p>El personaje central se renderiza en WebGL con volumen, iluminación y animación.</p></div>${slots.map(sl=>`<div class="card"><h3>${sl}</h3><p>${state.equip[sl]?state.equip[sl].name:'Sin equipar'}</p></div>`).join('')}</div>`;if(type==='worlds')return `<div class="grid">${worlds.map((w,i)=>`<div class="card"><h3>${String(i+1).padStart(2,'0')} · ${w}</h3><p>Etapas ${i*50+1}–${i*50+50}</p><p>Boss: ${bosses[i]}</p><p>${i<=Math.floor((state.highest-1)/50)?'Desbloqueado':'Bloqueado'}</p></div>`).join('')}</div>`;if(type==='skills')return `<div class="skilltree">${Array.from({length:18},(_,i)=>{const branch=i%6,x=10+(i%6)*16,y=12+Math.floor(i/6)*33;return `<button class="node ${branch===2?'blue':branch===3?'purple':''} ${state.skills[branch]>Math.floor(i/6)?'on':''}" data-node="${branch}" style="left:${x}%;top:${y}%">${['🛡','⚔','🎯','✦','♬','🔥'][branch]}</button>`}).join('')}</div>`;return `<div class="prestige"><div><div class="gear">⚙</div><h2>Rebobinado</h2><p>Etapa máxima: ${state.highest}</p><p>Fragmentos actuales: ${state.prestige}</p><button id="doPrestige" class="btn">REBOBINAR REALIDAD</button></div></div>`}
function equip(i){const it=state.inventory[i];state.equip[it.slot]=it;state.inventory.splice(i,1);save();openOverlay('inventory');toast(it.name+' equipado')}
function buyNode(branch){const cost=100*(state.skills[branch]+1);if(state.gold<cost)return toast('Necesitas '+cost+' oro');state.gold-=cost;state.skills[branch]++;save();openOverlay('skills');toast('Nodo mejorado')}
function bindUI(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openOverlay(b.dataset.open));document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>useSkill(Number(b.dataset.skill)));document.querySelector('#auto').onclick=()=>{state.auto=!state.auto;document.querySelector('#auto').textContent='AUTO '+(state.auto?'ON':'OFF');save()};document.querySelector('#speed').onclick=()=>{state.speed=state.speed===1?2:1;document.querySelector('#speed').textContent='x'+state.speed};window.onkeydown=e=>{const i=['q','w','e','r'].indexOf(e.key.toLowerCase());if(i>=0)useSkill(i)}}
function syncHUD(){const eh=document.querySelector('#ehp'),ph=document.querySelector('#php'),lg=document.querySelector('#log');if(eh)eh.style.width=(enemy.hp/enemy.max*100)+'%';if(ph)ph.style.width=(state.hp/pmax()*100)+'%';if(lg)lg.innerHTML=logs.map(x=>`<span class="${x.c}">${x.t}</span>`).join('');skillCD.forEach((v,i)=>{const c=document.querySelector('#cd'+i);if(c)c.style.setProperty('--cd',Math.min(100,v/[3.2,5,4.2,9][i]*100)+'%')})}
function damagePop(n,crit=false,red=false){const view=document.querySelector('.view');if(!view)return;const d=document.createElement('div');d.className='damage-pop '+(red?'red ':crit?'crit ':'');d.textContent=(crit?'CRIT ':'')+n;d.style.left=(red?24+Math.random()*12:66+Math.random()*12)+'%';d.style.top=(red?54:42+Math.random()*12)+'%';view.appendChild(d);setTimeout(()=>d.remove(),800)}
function flash(){const f=document.querySelector('#flash');if(f){f.classList.remove('hit');void f.offsetWidth;f.classList.add('hit')}}
let renderer,scene,camera,maraGroup,enemyGroup,sword,enemyArm,particles=[],worldClock=0,attackAnim=0,enemyAnim=0;
function mat(c,metal=.25,rough=.55,em=0){return new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:rough,emissive:em?c:0,emissiveIntensity:em})}
function addMesh(g,geo,m,pos=[0,0,0],rot=[0,0,0],scale=[1,1,1]){const o=new THREE.Mesh(geo,m);o.position.set(...pos);o.rotation.set(...rot);o.scale.set(...scale);g.add(o);return o}
function gear(g,r=0.45,pos=[0,0,0],color=0xc8903d){const tor=addMesh(g,new THREE.TorusGeometry(r,.08,12,28),mat(color,.8,.28),pos);for(let i=0;i<10;i++){const a=i/10*Math.PI*2;addMesh(g,new THREE.BoxGeometry(.13,.24,.12),mat(color,.8,.3),[pos[0]+Math.cos(a)*r,pos[1]+Math.sin(a)*r,pos[2]],[0,0,a])}return tor}
function maraModel(){const g=new THREE.Group();g.name='Mara';const skin=mat(0xe6b78e,.05,.75),dark=mat(0x141318,.2,.45),red=mat(0x7b2e35,.25,.48),gold=mat(0xc8903d,.75,.3),cream=mat(0xf5ebd7,.1,.65),blue=mat(0x2d7475,.4,.3,.18);addMesh(g,new THREE.SphereGeometry(.42,24,18),skin,[0,2.55,0]);addMesh(g,new THREE.SphereGeometry(.48,22,16),dark,[0,2.7,-.05],[0,0,0],[1.02,.65,1.02]);addMesh(g,new THREE.CapsuleGeometry(.42,1.0,6,14),red,[0,1.55,0]);addMesh(g,new THREE.BoxGeometry(.38,.9,.23),cream,[0,1.63,.35]);addMesh(g,new THREE.CylinderGeometry(.18,.22,.9,14),dark,[-.23,.65,0],[0,0,.06]);addMesh(g,new THREE.CylinderGeometry(.18,.22,.9,14),dark,[.23,.65,0],[0,0,-.06]);addMesh(g,new THREE.SphereGeometry(.27,14,10),dark,[-.25,.13,.1],[0,0,0],[1.2,.55,1.5]);addMesh(g,new THREE.SphereGeometry(.27,14,10),dark,[.25,.13,.1],[0,0,0],[1.2,.55,1.5]);addMesh(g,new THREE.CylinderGeometry(.12,.14,.9,12),skin,[-.5,1.62,0],[0,0,-.45]);const armR=addMesh(g,new THREE.CylinderGeometry(.12,.14,.95,12),skin,[.52,1.6,0],[0,0,.7]);armR.name='armR';gear(g,.27,[-.33,1.86,-.36]);const goggles=new THREE.Group();addMesh(goggles,new THREE.TorusGeometry(.15,.045,8,18),gold,[-.16,0,0]);addMesh(goggles,new THREE.TorusGeometry(.15,.045,8,18),gold,[.16,0,0]);addMesh(goggles,new THREE.BoxGeometry(.16,.04,.04),gold,[0,0,0]);goggles.position.set(0,2.83,.36);g.add(goggles);addMesh(g,new THREE.ConeGeometry(.24,.75,16),red,[-.47,2.54,-.16],[0,0,-1.0]);sword=new THREE.Group();addMesh(sword,new THREE.CylinderGeometry(.07,.09,.72,12),gold,[0,-.38,0]);addMesh(sword,new THREE.BoxGeometry(.58,.1,.1),gold,[0,0,0]);addMesh(sword,new THREE.BoxGeometry(.13,2.0,.13),mat(0xffc247,.6,.2,.7),[0,.95,0]);addMesh(sword,new THREE.ConeGeometry(.14,.5,6),mat(0xffe195,.5,.18,.8),[0,2.2,0]);sword.position.set(.83,1.63,.05);sword.rotation.z=-1.0;g.add(sword);g.scale.set(.82,.82,.82);return g}
function enemyModel(){const g=new THREE.Group();const dark=mat(0x111116,.7,.35),red=mat(0x7d1e2d,.4,.42),gold=mat(0xb97b32,.85,.25),bone=mat(0xe7ddc6,.1,.6),glow=mat(0xff3131,.2,.15,1.1);addMesh(g,new THREE.CapsuleGeometry(.65,1.35,8,14),dark,[0,1.55,0]);addMesh(g,new THREE.SphereGeometry(.58,20,14),bone,[0,3.12,0],[0,0,0],[1,.78,.88]);addMesh(g,new THREE.CylinderGeometry(.58,.45,1.05,18),dark,[0,3.85,0]);addMesh(g,new THREE.CylinderGeometry(.86,.86,.12,20),dark,[0,3.37,0]);addMesh(g,new THREE.SphereGeometry(.1,10,8),glow,[-.2,3.16,.48]);addMesh(g,new THREE.SphereGeometry(.1,10,8),glow,[.2,3.16,.48]);addMesh(g,new THREE.BoxGeometry(.36,.08,.08),dark,[0,2.93,.48],[0,0,.15]);gear(g,.43,[0,1.85,-.55]);enemyArm=new THREE.Group();addMesh(enemyArm,new THREE.CylinderGeometry(.13,.17,1.65,10),gold,[0,-.7,0]);for(let i=0;i<3;i++)addMesh(enemyArm,new THREE.ConeGeometry(.07,.55,8),bone,[0,-1.65+i*.12,(-.18+i*.18)],[Math.PI/2,0,(i-1)*.28]);enemyArm.position.set(-.75,2.25,.05);enemyArm.rotation.z=.78;g.add(enemyArm);const arm2=enemyArm.clone();arm2.position.x=.75;arm2.rotation.z=-.78;g.add(arm2);addMesh(g,new THREE.ConeGeometry(1.25,2.0,5),red,[0,.85,-.3],[0,0,Math.PI]);g.scale.set(.83,.83,.83);return g}
function init3D(){const canvas=document.querySelector('#game3d');if(!canvas)return;if(renderer){renderer.dispose()}renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x08101b,.065);camera=new THREE.PerspectiveCamera(38,1,.1,100);camera.position.set(0,4.2,12.8);camera.lookAt(0,1.7,0);scene.add(new THREE.HemisphereLight(0x4f6a8c,0x2a130d,1.4));const key=new THREE.DirectionalLight(0xffc37a,3.0);key.position.set(-3,7,6);key.castShadow=true;scene.add(key);const rim=new THREE.PointLight(0x7b5cff,25,16);rim.position.set(4,4,-2);scene.add(rim);const warm=new THREE.PointLight(0xff4a2f,20,11);warm.position.set(-4,2,2);scene.add(warm);const floor=addMesh(scene,new THREE.PlaneGeometry(30,14),new THREE.MeshStandardMaterial({color:0x17171b,metalness:.75,roughness:.35}),[0,0,0],[-Math.PI/2,0,0]);floor.receiveShadow=true;for(let i=0;i<7;i++){const x=-8+i*2.6;addMesh(scene,new THREE.BoxGeometry(1.8,3+Math.random()*3,1.8),mat(0x10141c,.45,.75),[x,1.5,-6-Math.random()*2]);addMesh(scene,new THREE.ConeGeometry(.9,2,4),mat(0x0c1018,.3,.7),[x,4.2+Math.random()*2,-6])}addMesh(scene,new THREE.SphereGeometry(2.25,32,20),mat(0xf6dda8,.05,.7,.25),[4.7,6.6,-9]);for(let i=0;i<16;i++){const x=-9+Math.random()*18,z=-7+Math.random()*6;const l=new THREE.PointLight(0xffb15a,3.5,2.8);l.position.set(x,.6,z);scene.add(l);addMesh(scene,new THREE.CylinderGeometry(.03,.05,.7,6),mat(0x332415,.6,.5),[x,.35,z])}maraGroup=maraModel();maraGroup.position.set(-2.8,.05,0);scene.add(maraGroup);enemyGroup=enemyModel();enemyGroup.position.set(2.9,.05,-.15);scene.add(enemyGroup);particles=[];resize3D();window.addEventListener('resize',resize3D);syncEnemyModel()}
function resize3D(){if(!renderer||!camera)return;const c=renderer.domElement,w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
function syncEnemyModel(){if(!enemyGroup)return;const boss=isBoss();enemyGroup.scale.setScalar(boss?1.15:isMini()?.95:.75);enemyGroup.traverse(o=>{if(o.material&&o.material.emissive)o.material.emissiveIntensity=Math.min(o.material.emissiveIntensity,.8)})}
function maraAttack(power=1){attackAnim=1*power}function enemyAttack(){enemyAnim=1}
function spark(toEnemy=true){if(!scene)return;for(let i=0;i<14;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.035,5,4),mat(toEnemy?0xffa43b:0xe34a4a,.1,.3,.8));m.position.set(toEnemy?1.5:-1.5,1.4+Math.random()*.9,(Math.random()-.5)*.5);m.userData.v=new THREE.Vector3((Math.random()-.5)*2.4,Math.random()*2.4,(Math.random()-.5)*1.5);m.userData.life=.55+Math.random()*.4;scene.add(m);particles.push(m)}}
function burst(kind){if(!scene)return;const colors={blue:0x59b7ff,fire:0xff7a2b,ice:0xb7ecff,void:0xc45cff,loot:0xe7b14e,boss:0xff3e49,level:0xffe4a4};const c=colors[kind]||0xffffff;for(let i=0;i<28;i++){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(.05,0),mat(c,.2,.25,.8));m.position.set(kind==='loot'?-2.7:kind==='boss'?2.8:0,1.4+Math.random(),0);m.userData.v=new THREE.Vector3((Math.random()-.5)*4,Math.random()*3.4,(Math.random()-.5)*3);m.userData.life=.7+Math.random()*.7;scene.add(m);particles.push(m)}}
function animate3D(dt){if(!renderer||!scene)return;worldClock+=dt;const idle=Math.sin(worldClock*3)*.06;maraGroup.position.y=.05+idle;maraGroup.rotation.y=Math.sin(worldClock*.7)*.04;enemyGroup.position.y=.05+Math.sin(worldClock*2.2)*.04;gearSpin(scene,dt);if(attackAnim>0){attackAnim=Math.max(0,attackAnim-dt*2.7);const p=Math.sin((1-attackAnim)*Math.PI);maraGroup.position.x=-2.8+p*1.25;sword.rotation.z=-1.0+p*2.0;sword.rotation.x=p*.35}else{maraGroup.position.x+=( -2.8-maraGroup.position.x)*.15;sword.rotation.z+=( -1.0-sword.rotation.z)*.18;sword.rotation.x*=.82}if(enemyAnim>0){enemyAnim=Math.max(0,enemyAnim-dt*2.2);enemyGroup.rotation.z=Math.sin((1-enemyAnim)*Math.PI)*-.16}else enemyGroup.rotation.z*=.82;for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.userData.life-=dt;p.position.addScaledVector(p.userData.v,dt);p.userData.v.y-=4.5*dt;p.scale.multiplyScalar(.985);if(p.userData.life<=0){scene.remove(p);particles.splice(i,1)}}camera.position.x=Math.sin(worldClock*.13)*.12;camera.lookAt(0,1.7,0);renderer.render(scene,camera)}
function gearSpin(obj,dt){obj.traverse(o=>{if(o.geometry&&o.geometry.type==='TorusGeometry')o.rotation.z+=dt*.7})}
function loop(t){const dt=Math.min(.05,(t-last)/1000)*state.speed;last=t;attackTimer-=dt;enemyTimer-=dt;for(let i=0;i<4;i++)skillCD[i]=Math.max(0,skillCD[i]-dt);if(state.auto&&attackTimer<=0){hitEnemy(1,.05);attackTimer=Math.max(.38,1.15-state.level*.008)}if(enemyTimer<=0){enemyHit();enemyTimer=Math.max(.7,1.55-state.stage*.002)}syncHUD();animate3D(dt);requestAnimationFrame(loop)}
offline();spawn();renderUI();requestAnimationFrame(loop);setInterval(save,5000);
</script></body></html>
