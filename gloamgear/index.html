)}${e.k==='boss'?` · FASE ${phase}`:''}</small><div class="hp"><i id="ehp" style="width:${100*e.hp/e.max}%"></i></div></div><div class="phud"><div class="face">${sh(0)}</div><div><small>MARA VELL · NV. ${s.level}</small><div class="hp"><i id="php" style="width:${100*s.hp/st.hp}%"></i></div><div class="mana"><i id="energy" style="width:${s.en}%"></i></div></div></div></div><div class="combatbar"><div id="log" class="log">${logs.map(x=>`<span class="${x.c}">${x.t}</span>`).join('')}</div><div class="skills">${['✦','🔥','⚡','◉'].map((z,i)=>`<button class="orb" data-skill="${i}">${z}<div id="cd${i}" class="cd"></div><b>${'QWER'[i]}</b></button>`).join('')}</div></div></section><aside class="right"><div class="panel"><div class="pt">Mapa del mundo</div><div class="pb"><div class="map"><div class="mnodes">${[10,20,30,40,50].map(n=>`<i class="mn ${ls()>=n?'on':''}"></i>`).join('')}</div></div></div></div><div class="panel"><div class="pt">Botín de etapa</div><div class="pb"><div class="grid4">${[14,15,16,17,18,19,20,21].map(i=>`<div class="icon">${sh(i)}</div>`).join('')}</div></div></div><div class="panel"><div class="pt">Enemigos</div><div class="pb"><div class="grid4">${[2,3,4,e.idx].map(i=>`<div class="icon">${sh(i)}</div>`).join('')}</div><p style="font-size:10px">Boss: ${W[w][2]}</p></div></div></aside></div><footer>${[['Combate','⚔'],['Inventario','▣'],['Personaje','♟'],['Árbol','✺'],['Maestrías','◎'],['Misiones','✦'],['Logros','★'],['Codex','⌾'],['Prestigio','✧']].map(x=>`<button class="nav ${x[0]==='Combate'&&!modal?'on':''}" data-m="${x[0]}">${x[1]} ${x[0]}</button>`).join('')}<span class="sp"></span><button class="nav" id="pause">${paused?'▶ Reanudar':'Ⅱ Pausar'}</button><button class="nav" id="autoskill">Habilidades ${autoSkills?'AUTO':'MANUAL'}</button><button class="nav" id="auto">AUTO ${auto?'ON':'OFF'}</button><button class="nav" id="spd">x${speed}</button><button class="nav" id="snd">♫ ${audio?'ON':'OFF'}</button></footer><div id="modal">${modal?modalHTML():''}</div></div>`;bind();hud()}
function modalHTML(){return`<div class="modal"><div class="win"><div class="wh"><h2>${modal}</h2><button class="close">Cerrar ✕</button></div><div class="wb">${body(modal)}</div></div></div>`}
function body(m){if(m==='Inventario')return`<div class="equip">${SLOTS.map(z=>{let q=s.eq[z];return`<div class="slot"><b>${z}</b>${q?`${q.name}<br><span style="color:${RC[q.rar]}">${RAR[q.rar]} +${q.pow}</span>`:'Vacío'}</div>`}).join('')}</div><div class="cards">${s.inv.length?s.inv.map((q,i)=>`<div class="card"><h3>${q.name}</h3><b style="color:${RC[q.rar]}">${RAR[q.rar]}</b><p>${q.slot} · Poder ${q.pow}</p><button class="btn pri" data-equip="${i}">Equipar</button> <button class="btn" data-sell="${i}">Vender</button></div>`).join(''):'<div class="notice">Sin objetos todavía. Sigue combatiendo para conseguir equipo.</div>'}</div>`;if(m==='Personaje'){let t=stats();return`<div class="notice">Mara Vell · portadora del Framecutter. El equipo, los talentos y las maestrías modifican el combate.</div><div class="stats">${[['Nivel',s.level],['Ataque',fmt(t.atk)],['Defensa',fmt(t.def)],['Vida',fmt(t.hp)],['Crítico',Math.round(t.crit*100)+'%'],['Velocidad',t.asp.toFixed(2)],['Stage máximo',s.high],['Prestigio',s.prestige]].map(q=>`<div class="stat"><small>${q[0]}</small><b>${q[1]}</b></div>`).join('')}</div><h3>Equipo</h3><div class="equip">${SLOTS.map(z=>`<div class="slot"><b>${z}</b>${s.eq[z]?.name||'Vacío'}</div>`).join('')}</div>`}if(m==='Árbol')return`<div class="notice">120 nodos · 6 ramas. Coste de nodo: oro escalado. Haz clic en el siguiente nodo de cada rama.</div><div class="branches">${BR.map((b,bi)=>`<div class="branch"><h3>${b}</h3><div class="nodes">${Array.from({length:20},(_,j)=>{let i=bi*20+j;return`<button class="node ${s.nodes[i]?'on':''}" data-node="${i}">${j+1}</button>`}).join('')}</div></div>`).join('')}</div>`;if(m==='Maestrías')return`<div class="cards">${MAST.map((x,i)=>{let l=Math.min(20,Math.floor(s.mastery[i]/100));return`<div class="card"><h3>${x} Mastery</h3><p>Nivel ${l}/20${l>=20?' + Paragon':''}</p><div class="mbar"><i style="width:${s.mastery[i]%100}%"></i></div><p>+${(l*1.5).toFixed(1)}% efecto.</p></div>`}).join('')}</div>`;if(m==='Misiones')return '<div class="notice">Objetivos de la travesía. Las recompensas se guardan en esta partida local.</div><div class="cards">'+Array.from({length:30},(_,i)=>{const goal=(i+1)*10,progress=Math.min(goal,s.stats.kills);return '<div class="card"><h3>Cue '+(i+1)+'</h3><p>Derrota '+goal+' enemigos · '+progress+'/'+goal+'</p><div class="mbar"><i style="width:'+progress/goal*100+'%"></i></div><p>Recompensa: '+50*(i+1)+' oro</p><button class="btn" data-quest="'+i+'" '+(s.quests[i]||progress<goal?'disabled':'')+'>'+(s.quests[i]?'Reclamado':'Reclamar')+'</button></div>';}).join('')+'</div>';if(m==='Logros')return`<div class="notice">100 logros persistentes. Los hitos quedan registrados en esta partida local.</div><div class="cards">${Array.from({length:100},(_,i)=>`<div class="card"><h3>${s.ach[i]?'★':'☆'} Take ${i+1}</h3><p>${i<30?'Alcanza stage '+((i+1)*25):i<50?'Derrota '+((i-29)*50)+' enemigos':i<65?'Obtén '+((i-49)*5)+' objetos':i<80?'Derrota '+(i-64)+' bosses':'Alcanza nivel '+((i-79)*5)}</p><b>${s.ach[i]?'DESBLOQUEADO':'BLOQUEADO'}</b></div>`).join('')}</div>`;if(m==='Codex')return`<div class="notice">15 mundos · 750 stages · 15 bosses principales. Cada tarjeta muestra el fondo visual integrado del mundo.</div><div class="cards">${W.map((x,i)=>`<div class="card"><div class="worldthumb" style="--bp:${bg(i)}"></div><h3>${String(i+1).padStart(2,'0')} · ${x[0]}</h3><p>${x[1]}<br>Boss: ${x[2]}<br>Enemigos: ${EN[i].join(', ')}</p></div>`).join('')}</div>`;if(m==='Prestigio'){let g=Math.floor(Math.pow(Math.max(0,s.runHigh-120)/25,1.45)*(1+s.runBosses*.08));return`<div class="notice">Se desbloquea tras completar World 3. Reinicia nivel, oro, stage y equipo; conserva maestrías, logros, Gleam y Fragmentos de Continuidad.</div><div class="card" style="max-width:650px;margin:auto;text-align:center"><div style="font-size:70px;color:#e1a146">✧</div><h3>Prestigio / Rebobinado</h3><p>Etapa máxima de esta vuelta ${s.runHigh}<br>Fragmentos actuales ${s.frag}</p><p style="font-size:27px;color:#f0c36e">+${g} Fragmentos</p><button class="btn pri" id="prestige" ${s.runHigh<150?'disabled':''}>REBOBINAR</button></div>`}return''}
function bind(){
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{modal=b.dataset.m==='Combate'?'':b.dataset.m;render();});
 document.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>{const i=+b.dataset.world;if(i*50+1<=s.runHigh){s.stage=i*50+1;spawn();save();render();}else toast('Mundo bloqueado');});
 document.querySelectorAll('[data-skill]').forEach(b=>{const i=+b.dataset.skill;b.setAttribute('aria-label',['Framecutter','Ignición','Escarcha','Última vuelta'][i]);b.title=['Framecutter: sangrado (Q)','Ignición: quemadura (W, nivel 3)','Escarcha: aturdimiento y escudo (E, nivel 5)','Última vuelta: invocación y regeneración (R, nivel 10)'][i];b.onclick=()=>skill(i);});
 $('#auto').onclick=()=>{auto=!auto;save();render();};$('#spd').onclick=()=>{speed=speed===1?2:speed===2?4:1;render();};
 $('#snd').onclick=()=>{audio=!audio;if(audio)beep(440,.08);render();};
 $('#pause').onclick=()=>{paused=!paused;save();render();};$('#autoskill').onclick=()=>{autoSkills=!autoSkills;save();render();};
 const close=$('.close');if(close)close.onclick=()=>{modal='';render();};
 document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{const i=+b.dataset.equip,q=s.inv[i];if(!q)return;const previous=s.eq[q.slot];s.eq[q.slot]=q;s.inv.splice(i,1);if(previous)s.inv.push(previous);s.hp=Math.min(s.hp,stats().hp);save();render();});
 document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{const i=+b.dataset.sell,q=s.inv[i];if(!q)return;s.gold+=q.pow*4;s.inv.splice(i,1);save();render();});
 document.querySelectorAll('[data-node]').forEach(b=>{const i=+b.dataset.node,branch=Math.floor(i/20),rank=s.nodes.slice(branch*20,branch*20+20).filter(Boolean).length;b.disabled=s.nodes[i]||i!==branch*20+rank;b.setAttribute('aria-label',BR[branch]+' · talento '+(i%20+1));b.onclick=()=>{if(b.disabled)return;const cost=100+s.nodes.filter(Boolean).length*45;if(s.gold>=cost){s.gold-=cost;s.nodes[i]=true;save();render();}else toast('Oro insuficiente');};});
 document.querySelectorAll('[data-quest]').forEach(b=>b.onclick=()=>claimQuest(+b.dataset.quest));
 const prestige=$('#prestige');if(prestige)prestige.onclick=rewind;
}
function hud(){let st=stats(),q=$('#ehp');if(q)q.style.width=Math.max(0,100*e.hp/e.max)+'%';q=$('#php');if(q)q.style.width=Math.max(0,100*s.hp/st.hp)+'%';q=$('#energy');if(q)q.style.width=s.en+'%';for(let i=0;i<4;i++){q=$('#cd'+i);if(q)q.style.setProperty('--cd',Math.min(100,cd[i]/[3.5,6,9,18][i]*100)+'%')}q=$('#log');if(q)q.innerHTML=logs.map(x=>`<span class="${x.c}">${x.t}</span>`).join('')}
window.addEventListener('keydown',x=>{if(['INPUT','TEXTAREA','SELECT'].includes(x.target.tagName))return;if(x.key==='Escape'&&modal){modal='';render();return;}const i='qwer'.indexOf(x.key.toLowerCase());if(i>=0)skill(i);if(x.code==='Space'&&!modal){x.preventDefault();paused=!paused;save();render();}});window.addEventListener('beforeunload',save);window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else if(s){collectOffline(s.time);level();save();if(offlineSummary){toast(offlineSummary);offlineSummary=null;}last=performance.now();}});load();})();
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
